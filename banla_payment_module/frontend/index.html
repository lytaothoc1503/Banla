<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banla Boutique Hotel Đà Lạt — Thanh Toán Ưu Tiên</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,450;500&display=swap" rel="stylesheet">
  <style>
    body { background-color: #eef2f3; color: #1a2428; font-family: 'Figtree', sans-serif; }
    h1, h2, h3 { font-family: 'Fraunces', serif; }
  </style>
</head>
<body class="p-4 sm:p-8 flex items-center justify-center min-h-screen">
  <div class="max-w-xl w-full bg-white p-6 sm:p-8 rounded-2xl border border-[#dfe6e8] shadow-sm">
    <div class="flex items-center justify-between border-b border-[#dfe6e8] pb-4 mb-6">
      <div>
        <p class="text-xs uppercase tracking-widest text-[#b8612e] font-semibold">Banla Boutique Hotel</p>
        <h1 class="text-2xl font-bold text-[#1a2428] mt-1">Élite Room · Gác Mái</h1>
      </div>
      <span class="text-xs px-3 py-1 bg-[#2a3f38]/10 text-[#2a3f38] font-semibold rounded-full">Đã xác minh</span>
    </div>
    
    <p class="text-sm text-[#5c6b72] mb-6 leading-relaxed">
      Ngoài lạnh. Trong ấm. Quý khách vui lòng xác nhận đặt phòng và chuyển khoản qua cổng thanh toán MB Bank Priority (VietQR tự động). Hệ thống sẽ xác nhận ngay lập tức qua kênh thời gian thực.
    </p>

    <div class="flex justify-between items-center bg-[#f4f7f8] p-4 rounded-xl border border-[#dfe6e8] mb-6">
      <span class="text-xs uppercase tracking-wider text-[#5c6b72] font-semibold">Số tiền đặt cọc</span>
      <span class="text-xl font-bold text-[#b8612e]">200.000 đ</span>
    </div>

    <button onclick="startCheckout()" class="w-full py-4 rounded-xl bg-[#b8612e] hover:bg-[#8f4520] text-white font-semibold transition shadow-md">
      Mở Cổng Thanh Toán Banla Priority →
    </button>
  </div>

  <!-- Nhúng SDK thanh toán Banla độc lập -->
  <script src="./banla-priority-modal.js"></script>
  <script>
    function startCheckout() {
      BanlaPayment.open({
        bookingId: 'BALA-2026-9821',
        amount: 200000,
        memo: 'BALA9821',
        accountNo: '0965999999',
        accountName: 'BANLA BOUTIQUE HOTEL',
        bankName: 'MB Bank',
        onSuccess: function(res) {
          console.log('Thanh toán hoàn tất:', res);
        }
      });
    }
  </script>
</body>
</html>
