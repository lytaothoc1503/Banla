<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banla Homestay - Living & Healing 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #EFE8DE; color: #322E2B; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-2xl mx-auto bg-[#FAF7F2] p-8 rounded-3xl border border-[#D5C7B5] shadow-sm">
    <div class="flex items-center justify-between border-b border-[#D5C7B5]/60 pb-4 mb-6">
      <h1 class="text-2xl font-bold text-[#322E2B]">Banla Deluxe Suite 402</h1>
      <span class="text-xs px-3 py-1 bg-[#636B46]/10 text-[#636B46] font-semibold rounded-full">Eco Healing 2026</span>
    </div>
    
    <p class="text-sm text-[#322E2B]/80 mb-6 leading-relaxed">
      Trải nghiệm không gian sống ấm áp, chữa lành và thư thái. Nhấn nút bên dưới để mở giao diện thanh toán chuẩn phong cách MB Bank Priority (Đen - Vàng Kim - Bạc) mà không làm ảnh hưởng giao diện gốc.
    </p>

    <div class="flex justify-between items-center bg-[#EFE8DE] p-4 rounded-2xl border border-[#D5C7B5]/40 mb-6">
      <span class="text-xs uppercase tracking-wider text-[#322E2B]/60 font-semibold">Tổng tiền thanh toán</span>
      <span class="text-xl font-bold text-[#A25B36]">200.000 VNĐ</span>
    </div>

    <button onclick="startCheckout()" class="w-full py-4 rounded-2xl bg-[#322E2B] hover:bg-black text-[#FAF7F2] font-semibold transition shadow-md">
      Thanh toán với Banla Priority Checkout →
    </button>
  </div>

  <!-- Nhúng SDK thanh toán Banla độc lập -->
  <script src="./banla-priority-modal.js"></script>
  <script>
    function startCheckout() {
      BanlaPayment.open({
        bookingId: 'BALA-2026-9821',
        amount: 200000,
        memo: 'BALA9821',
        onSuccess: function(res) {
          console.log('Thanh toán hoàn tất:', res);
        }
      });
    }
  </script>
</body>
</html>
