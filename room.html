<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết phòng — Banla Boutique Hotel</title>
  <meta name="description" content="Xem chi tiết phòng tại Banla Boutique Hotel Đà Lạt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,450;0,9..144,500;1,9..144,400;1,9..144,450&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header scrolled" id="header">
    <nav class="nav">
      <a href="index.html" class="logo">BANLA</a>
      <ul class="nav-links">
        <li><a href="index.html#rooms">Phòng nghỉ</a></li>
        <li><a href="index.html#contact" class="btn-nav">Đặt phòng</a></li>
      </ul>
    </nav>
  </header>

  <main class="room-detail">
    <a href="index.html#rooms" class="back-link">← Quay lại danh sách phòng</a>
    <div class="room-detail-hero" id="hero"></div>
    <div class="room-detail-info">
      <h1 id="name">Đang tải...</h1>
      <div class="room-meta">
        <span id="area"></span>
        <span id="capacity"></span>
      </div>
      <p id="description"></p>
      <span class="room-tag" id="tag"></span>
      <br><br>
      <a href="index.html#contact" class="btn btn-primary">Đặt phòng này</a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) { location.href = 'index.html#rooms'; }

    fetch('rooms.json')
      .then(r => r.json())
      .then(data => {
        const room = data.rooms.find(r => r.id === id);
        if (!room) { location.href = 'index.html#rooms'; return; }
        document.title = room.name + ' — Banla Boutique Hotel';
        document.getElementById('hero').style.backgroundImage = `url('${room.image}')`;
        document.getElementById('name').textContent = room.name;
        document.getElementById('area').textContent = room.area;
        document.getElementById('capacity').textContent = room.capacity;
        document.getElementById('description').textContent = room.description;
        document.getElementById('tag').textContent = room.tag;
      })
      .catch(() => location.href = 'index.html#rooms');
  </script>
</body>
</html>
