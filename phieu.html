<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Phiếu xác nhận đặt phòng | Banla Boutique Hotel Đà Lạt</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fog: #f2f5f6;
      --mist: #dfe6e8;
      --pine: #2a3f38;
      --pine-dark: #192622;
      --ember: #b8612e;
      --ink: #192622;
      --cream: #FAF7F2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #EAE6DF;
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      line-height: 1.5;
      padding: 20px 10px;
    }

    .action-bar {
      max-width: 1020px;
      margin: 0 auto 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .btn-act {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      font-family: inherit;
    }
    .btn-primary { background: var(--pine); color: #fff; }
    .btn-primary:hover { background: var(--pine-dark); }
    .btn-outline { background: #fff; color: var(--pine); border-color: var(--pine); }
    .btn-outline:hover { background: var(--fog); }
    .btn-fb { background: #1877F2; color: #fff; }
    .btn-fb:hover { background: #166fe5; }

    .slip-wrapper {
      max-width: 1020px;
      margin: 0 auto;
      overflow-x: auto;
      padding-bottom: 24px;
    }

    .loading-state, .error-state {
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 10px;
      max-width: 600px;
      margin: 40px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    @media print {
      body { background: #fff !important; padding: 0 !important; }
      .action-bar, .hint-print { display: none !important; }
      .slip-wrapper { padding: 0 !important; max-width: none !important; }
      .banla-slip-container {
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        min-width: 100% !important;
      }
      @page { size: A4 landscape; margin: 8mm; }
    }
  </style>
</head>
<body>

  <div class="action-bar" id="actionBar" style="display: none;">
    <button type="button" class="btn-act btn-primary" id="btnPrint">
      In / Lưu PDF (A4)
    </button>
    <button type="button" class="btn-act btn-outline" id="btnPng">
      Tải ảnh phiếu PNG
    </button>
    <a href="https://www.facebook.com/Banlaboutiquedalat/" target="_blank" rel="noopener" class="btn-act btn-fb">
      Nhắn Facebook Banla (Hỗ trợ 24/7)
    </a>
    <a href="tel:02969996999" class="btn-act btn-outline">
      Hotline: 0296.9996.999 - 0352554863
    </a>
  </div>
  <p class="hint-print" id="hintPrint" style="display: none; text-align: center; font-size: 12px; color: #64748b; margin-top: -6px; margin-bottom: 14px;">
    Mẹo in đẹp: Chọn <strong>Khổ ngang (Landscape)</strong> và bật <strong>"Đồ họa nền (Background graphics)"</strong> khi in hoặc lưu PDF.
  </p>

  <div class="slip-wrapper">
    <div id="slipContent">
      <div class="loading-state">
        <h3 style="color: var(--pine); margin-bottom: 8px;">Đang mở phiếu xác nhận dịch vụ...</h3>
        <p style="color: #718096; font-size: 13px;">Hệ thống đang tải thông tin đặt phòng và con dấu đỏ chính thức của Banla.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="phieu.js"></script>
  <script>
    (async function () {
      const urlParams = new URLSearchParams(window.location.search);
      const code = (urlParams.get('ma') || urlParams.get('id') || '').trim();
      const contact = (urlParams.get('contact') || '').trim();
      const key = (urlParams.get('key') || '').trim();
      const contentEl = document.getElementById('slipContent');
      const actionEl = document.getElementById('actionBar');
      const hintEl = document.getElementById('hintPrint');

      if (!code) {
        contentEl.innerHTML = `
          <div class="error-state">
            <h3 style="color: #cf222e; margin-bottom: 10px;">Chưa có mã đặt phòng</h3>
            <p style="color: #4A5568; font-size: 14px; margin-bottom: 14px;">Đường dẫn mở phiếu cần kèm mã đơn hợp lệ (Ví dụ: phieu.html?ma=BL9821).</p>
            <p style="font-size: 13px; color: #718096;">Quý khách vui lòng nhắn <a href="https://www.facebook.com/Banlaboutiquedalat/" target="_blank" style="color:#1877F2;font-weight:600;">Fanpage Facebook Banla</a> để được cung cấp phiếu.</p>
          </div>
        `;
        return;
      }

      let foundBooking = null;
      let localBooking = null;
      const cleanCode = code.replace(/^#+/, '').toLowerCase();
      const upperCode = cleanCode.toUpperCase();
      const isDemoMode = urlParams.get('demo') === '1';

      // 1. Đọc tạm từ LocalStorage (nếu vừa tạo trên cùng trình duyệt / GitHub Pages)
      try {
        const localRaw = localStorage.getItem('BANLA_BOOKINGS_STORE');
        if (localRaw) {
          const list = JSON.parse(localRaw);
          if (Array.isArray(list)) {
            localBooking = list.find(b =>
              String(b.id || '').toLowerCase() === cleanCode ||
              String(b.booking_code || '').toLowerCase() === cleanCode
            ) || null;
          }
        }
      } catch (e) {}

      // 2. Ưu tiên kiểm tra Backend API (/api/booking/detail) để nhận trạng thái đã duyệt mới nhất (G2)
      try {
        let apiUrl = '/api/booking/detail?id=' + encodeURIComponent(code);
        if (contact) apiUrl += '&contact=' + encodeURIComponent(contact);
        if (key) apiUrl += '&key=' + encodeURIComponent(key);
        const res = await fetch(apiUrl);
        if (res.ok) {
          const data = await res.json();
          if (data && data.success && data.booking) {
            foundBooking = data.booking;
          }
        }
      } catch (e) {}

      // 3. Thử đọc từ Supabase theo đúng mã đơn (G5: dùng .eq('booking_code', ...) thay vì .select('*'))
      if (!foundBooking && window.supabase) {
        try {
          const sbCfg = JSON.parse(localStorage.getItem('BANLA_SUPABASE_CONFIG') || '{}');
          const sbUrl = sbCfg.url || window.BANLA_SUPABASE_URL || '';
          const sbKey = sbCfg.anonKey || window.BANLA_SUPABASE_ANON_KEY || '';
          if (sbUrl && sbKey) {
            const client = window.supabase.createClient(sbUrl, sbKey);
            const { data } = await client
              .schema('banla')
              .from('bookings')
              .select('*')
              .eq('booking_code', upperCode)
              .maybeSingle();
            if (data) {
              foundBooking = data;
            }
          }
        } catch (e) {}
      }

      // 4. Nếu máy chủ / Supabase chưa trả về hoặc đang chạy tĩnh, hợp nhất với bản ghi LocalStorage
      if (localBooking) {
        const localPaid = String(localBooking.payment_status || localBooking.paymentStatus || '').toLowerCase() === 'paid';
        const remotePaid = foundBooking && String(foundBooking.payment_status || foundBooking.paymentStatus || '').toLowerCase() === 'paid';
        if (!foundBooking || (localPaid && !remotePaid)) {
          foundBooking = localBooking;
        }
      }

      // 5. Fallback mẫu mặc định chỉ khi bật ?demo=1 (G3: tránh in phiếu dấu đỏ mẫu khi không có ?demo=1)
      if (!foundBooking && isDemoMode) {
        const defaultSamples = [
          {
            id: 'BL9821', booking_code: 'BL9821', guest_name: 'Hoàng Minh Tuấn (Mẫu Demo)', guest_phone: '0988776655',
            guest_email: 'minhtuan.dalat@gmail.com', room_id: 'Élite Room', guests: 2,
            check_in: '2026-11-05', check_out: '2026-11-07', total_amount: 2500000, paid_amount: 2500000,
            payment_status: 'paid', booking_status: 'confirmed', smartlock_pin: '839204',
            note: 'Bản xem trước mẫu demo — Cần phòng tầng cao, view nhìn trọn thung lũng sương.'
          },
          {
            id: 'BL7342', booking_code: 'BL7342', guest_name: 'Trần Thị Mai Anh (Mẫu Demo)', guest_phone: '0912345678',
            guest_email: 'maianh.tran@outlook.com', room_id: 'Original Suite', guests: 2,
            check_in: '2026-11-10', check_out: '2026-11-12', total_amount: 3100000, paid_amount: 3100000,
            payment_status: 'paid', booking_status: 'confirmed', smartlock_pin: '561829',
            note: 'Bản xem trước mẫu demo — Kỷ niệm ngày cưới, setup giúp hoa tươi.'
          },
          {
            id: 'BL3519', booking_code: 'BL3519', guest_name: 'Phạm Trần Linh (Mẫu Demo)', guest_phone: '0965555555',
            guest_email: 'banhfuli1503@gmail.com', room_id: 'Deluxe Twin', guests: 2,
            check_in: '2027-02-02', check_out: '2027-02-04', total_amount: 1900000, paid_amount: 0,
            payment_status: 'pending', booking_status: 'pending', smartlock_pin: '',
            note: 'Đặt trực tuyến từ website Banla.'
          }
        ];
        foundBooking = defaultSamples.find(b => b.booking_code.toLowerCase() === cleanCode);
      }

      if (!foundBooking) {
        contentEl.innerHTML = `
          <div class="error-state">
            <h3 style="color: #cf222e; margin-bottom: 10px;">Không tìm thấy đơn #${code}</h3>
            <p style="color: #4A5568; font-size: 14px; margin-bottom: 12px;">Vui lòng kiểm tra lại mã đặt phòng hoặc liên hệ Hotline <strong>0296.9996.999 - 0352554863</strong> / Fanpage Facebook để được hỗ trợ.</p>
          </div>
        `;
        return;
      }

      const displayCode = foundBooking.booking_code || foundBooking.id || code;
      contentEl.innerHTML = window.BanlaSlip(foundBooking);
      actionEl.style.display = 'flex';
      hintEl.style.display = 'block';
      document.title = 'Phiếu xác nhận #' + displayCode + ' | Banla Boutique Hotel Đà Lạt';

      document.getElementById('btnPrint').addEventListener('click', function () {
        window.print();
      });

      document.getElementById('btnPng').addEventListener('click', function () {
        const target = document.getElementById('banlaSlipPrint');
        if (!target || !window.html2canvas) {
          window.print();
          return;
        }
        const origText = this.textContent;
        this.textContent = 'Đang tạo ảnh...';
        this.disabled = true;

        window.html2canvas(target, {
          scale: 2,
          backgroundColor: '#FAF7F2',
          useCORS: true
        }).then(function (canvas) {
          const link = document.createElement('a');
          link.download = 'Phieu-Xac-Nhan-Banla-' + displayCode + '.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(function () {
          alert('Vui lòng dùng nút In / Lưu PDF.');
        }).finally(() => {
          this.textContent = origText;
          this.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
